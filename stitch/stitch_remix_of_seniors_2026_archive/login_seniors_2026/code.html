<div class="relative">

</div>

<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-300 text-on-surface" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="sunset-gradient w-full py-5 rounded-full text-on-primary font-bold text-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 group">

<div class="mt-12 flex justify-center items-center gap-8 opacity-40 grayscale">
